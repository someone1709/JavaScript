<!doctype html>
<html lang="en">

    <title>welcome</title>
  </head>
  <body>
    <h1>HELLO</h1>
    <button id="stop">stop</button>
  </body>
  <script>
    const say = function(){
        console.log("hello world");
    }
    const sandy = function (){document.querySelector('h1').textContent = "best js series";}

        console.log("stopped");
    })

</script>
